
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijn toekomst? Geen idee! | LOB</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:#f4f5ff;background:#090d25;background-image:radial-gradient(ellipse at 80% 10%,#5738a066,transparent 45%),radial-gradient(ellipse at 10% 85%,#1264a466,transparent 45%),linear-gradient(130deg,#090d25,#161c44);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background:repeating-linear-gradient(90deg,transparent 0 85px,#79bfff 86px,transparent 87px),repeating-linear-gradient(0deg,transparent 0 85px,#aa8cff 86px,transparent 87px)}
main{position:relative;max-width:820px;margin:35px auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}
.logo{font-weight:800;letter-spacing:2px;color:#a5e8ff}
.small{font-size:14px;color:#c0c9e8}
.panel{background:#111a38ef;border:1px solid #5867a0;border-radius:22px;padding:30px;box-shadow:0 20px 60px #0005}
h1{font-size:clamp(32px,6vw,57px);line-height:1.1;margin:12px 0}
h2{font-size:27px;margin:12px 0}
h3{margin:18px 0 8px}
p{line-height:1.65}
.accent{color:#78e5ec}
.tag{font-size:13px;letter-spacing:1.5px;color:#83dbe8;font-weight:bold;text-transform:uppercase}
button,.choice{font:inherit;cursor:pointer}
button{border:0;border-radius:12px;padding:13px 20px;font-weight:bold;background:#7ee2e8;color:#102039}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.35;cursor:not-allowed}
.secondary{background:#27375e;color:#fff;border:1px solid #5267a2}
.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.choice{display:block;width:100%;text-align:left;padding:15px;margin:10px 0;border:1px solid #5267a2;background:#202c52;color:#fff;border-radius:12px}
.choice.selected{border-color:#80e9ed;background:#274a60}
.feedback{padding:15px;border-radius:12px;background:#243858;border-left:4px solid #7ee2e8;margin:18px 0}
label{display:block;font-weight:bold;margin:18px 0 8px}
textarea,input{width:100%;padding:13px;border:1px solid #6b79ad;border-radius:10px;background:#101832;color:white;font:inherit}
textarea{min-height:95px;resize:vertical}
.hint{color:#bfcbe8;font-size:14px}
.progress{height:8px;background:#27345b;border-radius:10px;overflow:hidden;margin:15px 0 25px}
.bar{height:100%;background:linear-gradient(90deg,#5f91ff,#79e5e4);transition:width .3s}
.guide{background:#182748;border:1px solid #405b90;border-radius:14px;padding:18px;margin:18px 0}
.guide details{margin-top:10px}
.guide summary{cursor:pointer;color:#8be9f0;font-weight:bold}
.guide article{max-height:270px;overflow:auto;padding:10px;background:#101a34;border-radius:8px;margin-top:12px}
.guide article p{font-size:14px}
.check{display:flex;align-items:flex-start;gap:10px;margin-top:15px;font-size:14px}
.check input{width:auto;margin-top:3px}
footer{text-align:center;color:#aab6d4;font-size:12px;padding:25px}
@media print{
body{background:white;color:black}
body:before,header,.buttons,.progress,.guide,footer{display:none!important}
main{margin:0;padding:0}
.panel{border:0;box-shadow:none;background:white;color:black}
.accent,.tag{color:black}
}
</style>
</head>
<body>
<main>
<header>
<div class="logo">LOB // MISSIE 01</div>
<div class="small">Periode 2 · Leerjaar 1</div>
</header>
<div class="progress"><div id="bar" class="bar"></div></div>
<section class="panel" id="screen"></section>
<footer>Jouw toekomst. Jouw keuzes. Jouw verhaal.</footer>
</main>
<script>
let step=0;
let answers={};
let looked={};
let selected={};
let notes={};
let name="";
let goal="";
let action="";
const screen=document.getElementById("screen");

const guide=[
["Wat is LOB?",`LOB betekent Loopbaanoriëntatie en -begeleiding. Je ontdekt wie je bent, waar je goed in bent, wat je leuk vindt en welk werk bij je past. Je hoeft nog niet te weten wat je later wilt worden. LOB is verplicht voor je diploma, maar geen examen met een cijfer. Je laat zien dat je actief aan je ontwikkeling werkt.`],
["Wat ga je ontdekken?",`1. Mezelf ontdekken: wat kan ik goed en wat vind ik belangrijk?
2. De wereld buiten school onderzoeken: welke ICT-banen en bedrijven zijn er?
3. Mensen ontmoeten: wie kan mij iets leren of verder helpen?
4. Mezelf laten zien: hoe laat ik zien wat ik kan?
5. Stappen richting stage zetten: welke stage past bij mij?`],
["Hoe werken de lessen?",`Je hebt iedere week één uur LOB. Je begint en sluit samen af. In periode 2 zijn er één verplichte startopdracht, zes keuzeopdrachten, een activiteit met een gastspreker en één verplichte eindopdracht. Je hoeft niet alle keuzeopdrachten te maken. Ook buiten de LOB-les kun je ervaringen opdoen die meetellen.`],
["Wat mag je zelf kiezen?",`Je kiest aan welke beschikbare opdracht je werkt en hoe je laat zien wat je hebt gedaan. Bijvoorbeeld met een verslag, filmpje, PowerPoint, infographic of podcast. Het gaat niet om de mooiste presentatie, maar om wat je hebt ontdekt en geleerd.`],
["Wat verwachten we van jou?",`Je doet actief mee, maakt de verplichte opdrachten, werkt serieus aan je gekozen opdrachten en kunt laten zien wat je hebt onderzocht. Je denkt na over wat je leert, gebruikt feedback en levert afgesproken resultaten in via Teams. Kwaliteit is belangrijker dan zoveel mogelijk opdrachten maken.`],
["Wanneer is je werk voldoende?",`De docent kijkt naar inzet, eigen werk en ervaringen, ontwikkeling en reflectie. Kun je vertellen wat goed ging, wat beter kan en wat je volgende stap is? De docent bespreekt met je of je voldoende hebt laten zien.`],
["Hoe sluit je periode 2 af?",`Je maakt een persoonlijk overzicht van wat je hebt gedaan, over jezelf hebt ontdekt, welke feedback je hebt gekregen en wat je hierna wilt onderzoeken. Je kiest zelf de vorm.`],
["Hoe rond je LOB uiteindelijk af?",`LOB loopt door tijdens je opleiding. Je werkt aan kwaliteitenreflectie, motievenreflectie, werkexploratie, loopbaansturing en netwerken. Je verzamelt bewijs in je LOB-portfolio, houdt het LOB-verantwoordingsformulier bij en bespreekt je ontwikkeling en vervolgstappen met je SLB'er.`]
];

const missions=[
{
title:"Diploma zonder LOB?",
story:"Je klasgenoot zegt: 'LOB heeft geen cijfer. Dan hoef ik het dus niet te doen.'",
section:0,
question:"Wat klopt volgens de studiewijzer?",
options:["LOB is vrijwillig.","LOB is verplicht, maar geen examen met een cijfer.","Alleen studenten die stage lopen doen LOB."],
correct:1,
why:"Leg in je eigen woorden uit waarom LOB toch belangrijk is voor je diploma.",
feedback:"Precies. Geen cijfer betekent niet dat je niets hoeft te doen. Je moet laten zien dat je aan je ontwikkeling werkt."
},
{
title:"Zes opdrachten?!",
story:"Een student ziet zes keuzeopdrachten en roept: 'Moet ik die allemaal af hebben?'",
section:2,
question:"Wat staat er echt?",
options:["Je moet alle zes maken.","Je hoeft geen enkele opdracht te doen.","Je kiest uit de beschikbare opdrachten en hoeft ze niet allemaal te maken."],
correct:2,
why:"Welke opdrachten zijn in periode 2 wél verplicht? Noem ze.",
feedback:"Goed gevonden. Je krijgt keuzevrijheid, maar er zijn ook verplichte onderdelen."
},
{
title:"De opdrachtpolitie",
story:"Je wilt een video maken in plaats van een verslag. Iemand zegt dat LOB alleen schriftelijk mag.",
section:3,
question:"Wat zegt de studiewijzer?",
options:["Je mag zelf een passende vorm kiezen.","Alleen Word is toegestaan.","Je hoeft niets in te leveren als je een video maakt."],
correct:0,
why:"Noem twee andere vormen waarin je jouw werk kunt laten zien.",
feedback:"Inderdaad. De vorm mag verschillen. Wat je hebt ontdekt en geleerd blijft het belangrijkst."
},
{
title:"Snel klaar is toch goed?",
story:"Een klasgenoot maakt in tien minuten vier opdrachten. Jij werkt langer aan één goede opdracht.",
section:4,
question:"Wat is volgens de studiewijzer belangrijk?",
options:["Wie het meeste maakt, is automatisch klaar.","Alleen snelheid telt.","Inzet, eigen werk, ontwikkeling en reflectie tellen mee."],
correct:2,
why:"Zoek bij 'Wanneer is je werk voldoende?' en noteer één voorbeeld van wat jij kunt laten zien.",
feedback:"Juist. LOB is geen wedstrijd in opdrachten afvinken."
},
{
title:"En dan? Klaar?",
story:"Het einde van periode 2 komt eraan. Je hebt allerlei dingen gedaan, maar wat moet je ermee?",
section:6,
question:"Wat maak je aan het einde van de periode?",
options:["Een persoonlijk overzicht van je ervaringen en ontwikkeling.","Een examen met honderd vragen.","Helemaal niets."],
correct:0,
why:"Welke vier dingen komen in dat overzicht terug? Zoek ze op en noem er minstens twee.",
feedback:"Goed. Je kijkt terug, gebruikt feedback en denkt na over je volgende stap."
}
];

function escapeHTML(s){
return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}
function setScreen(html){
screen.innerHTML=html;
document.getElementById("bar").style.width=(step/7*100)+"%";
}
function studyBox(){
return `<div class="guide">
<strong>📖 Jouw studiewijzer</strong>
<p class="hint">Open de studiewijzer hieronder. Zoek de juiste kop en lees de tekst. Je hebt deze informatie nodig.</p>
<details id="guideDetails" ontoggle="markRead()">
<summary>Open de studiewijzer</summary>
<article>${guide.map((g,i)=>`<h3>${escapeHTML(g[0])}</h3><p>${escapeHTML(g[1]).replaceAll("\n","<br>")}</p>`).join("")}</article>
</details>
</div>`;
}
function markRead(){
const d=document.getElementById("guideDetails");
if(d&&d.open){looked[step]=true;updateButton();}
}
function choose(i){
selected[step]=i;
document.querySelectorAll(".choice").forEach((b,n)=>b.classList.toggle("selected",i===n));
updateButton();
}
function updateButton(){
const btn=document.getElementById("checkBtn");
if(btn)btn.disabled=!(looked[step]&&selected[step]!==undefined&&document.getElementById("reason").value.trim().length>=20);
}
function checkAnswer(){
const m=missions[step-1];
notes[step]=document.getElementById("reason").value.trim();
answers[step]=selected[step];
const ok=selected[step]===m.correct;
document.getElementById("result").innerHTML=`<div class="feedback"><strong>${ok?"Goed gevonden!":"Kijk nog eens in de studiewijzer."}</strong><p>${ok?m.feedback:"Zoek de kop '"+m.section+"' niet op nummer, maar lees de tekst bij '"+guide[m.section][0]+"'. Je kunt je antwoord aanpassen."}</p></div>`;
if(ok){
document.getElementById("nextBtn").disabled=false;
document.getElementById("checkBtn").disabled=true;
document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
document.getElementById("reason").readOnly=true;
}else{
selected[step]=undefined;
document.querySelectorAll(".choice").forEach(b=>{b.disabled=false;b.classList.remove("selected")});
updateButton();
}
}
function render(){
if(step===0){
setScreen(`<div class="tag">Welkom bij je eerste missie</div>
<h1>MIJN TOEKOMST?<br><span class="accent">GEEN IDEE!</span></h1>
<p>Mooi. Dan heb je iets te ontdekken.</p>
<p>In deze missie kom je vijf situaties tegen. Je gebruikt de studiewijzer om antwoorden te vinden. Daarna maak je jouw persoonlijke LOB-startkaart.</p>
<h3>Lesdoel</h3>
<p><strong>Aan het eind van de les kun je uitleggen wat LOB is, hoe je tijdens LOB zelf keuzes maakt en wat jij deze periode wilt ontdekken.</strong></p>
<p class="hint">Je hoeft niet alles al te weten. Wel moet je zelf zoeken en nadenken.</p>
<div class="buttons"><button onclick="go(1)">Start mijn missie →</button></div>`);
return;
}
if(step>=1&&step<=5){
const m=missions[step-1];
setScreen(`<div class="tag">Missie ${step} van 5</div>
<h2>${m.title}</h2><p>${m.story}</p>
${studyBox()}
<p class="hint">Zoek eerst de kop <strong>${guide[m.section][0]}</strong> op in de studiewijzer.</p>
<h3>${m.question}</h3>
${m.options.map((o,i)=>`<button class="choice" onclick="choose(${i})">${"ABC"[i]}. ${o}</button>`).join("")}
<label for="reason">${m.why}</label>
<textarea id="reason" oninput="updateButton()" placeholder="Schrijf hier wat je in de studiewijzer hebt gevonden..."></textarea>
<p class="hint">Open de studiewijzer, kies een antwoord en schrijf minimaal 20 tekens in je eigen woorden.</p>
<div id="result"></div>
<div class="buttons">
<button class="secondary" onclick="go(${step-1})">← Terug</button>
<button id="checkBtn" disabled onclick="checkAnswer()">Controleer mijn antwoord</button>
<button id="nextBtn" disabled onclick="go(${step+1})">Volgende missie →</button>
</div>`);
return;
}
if(step===6){
setScreen(`<div class="tag">Jij aan het stuur</div>
<h2>Wat wil jij ontdekken?</h2>
<p>Er zijn geen foute antwoorden. Kies wat jij deze periode interessant vindt.</p>
${["Waar ik goed in ben","Wat ik leuk of belangrijk vind","Welke banen en bedrijven er zijn","Wie mij verder kan helpen","Welke stage bij mij past"].map(x=>`<button class="choice" onclick="pickGoal(this,'${x}')">${x}</button>`).join("")}
<div class="buttons"><button class="secondary" onclick="go(5)">← Terug</button><button id="goalBtn" disabled onclick="go(7)">Verder →</button></div>`);
return;
}
if(step===7){
setScreen(`<div class="tag">Mijn eerste stap</div>
<h2>Maak jouw startkaart</h2>
<p>Je hoeft je toekomst niet uit te stippelen. Bedenk één kleine stap.</p>
<label for="student">Je naam</label><input id="student" value="${escapeHTML(name)}" oninput="name=this.value;validateCard()">
<p>Ik wil deze periode ontdekken: <strong class="accent">${escapeHTML(goal)}</strong></p>
<label for="action">Wat kun jij doen om dit te ontdekken?</label>
<textarea id="action" oninput="action=this.value;validateCard()" placeholder="Bijvoorbeeld: iemand interviewen, een bedrijf onderzoeken of feedback vragen...">${escapeHTML(action)}</textarea>
<div class="buttons"><button class="secondary" onclick="go(6)">← Terug</button><button id="finishBtn" disabled onclick="go(8)">Maak mijn startkaart →</button></div>`);
validateCard();return;
}
if(step===8){
setScreen(`<div class="tag">Missie voltooid</div>
<h1>DIT IS MIJN <span class="accent">START!</span></h1>
<h2>Mijn LOB-startkaart</h2>
<p><strong>Naam:</strong> ${escapeHTML(name)}</p>
<p><strong>Wat wil ik ontdekken?</strong><br>${escapeHTML(goal)}</p>
<p><strong>Mijn eerste stap:</strong><br>${escapeHTML(action)}</p>
<h3>Wat ik in de studiewijzer heb opgezocht</h3>
${missions.map((m,i)=>`<p><strong>${m.title}</strong><br>${escapeHTML(notes[i+1]||"")}</p>`).join("")}
<p>Bewaar deze startkaart als PDF en lever hem in via Teams.</p>
<div class="buttons"><button class="secondary" onclick="go(7)">← Aanpassen</button><button onclick="window.print()">Bewaar als PDF / Print</button></div>`);
}
}
function pickGoal(btn,value){
goal=value;
document.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));
btn.classList.add("selected");
document.getElementById("goalBtn").disabled=false;
}
function validateCard(){
const b=document.getElementById("finishBtn");
if(b)b.disabled=!(name.trim()&&action.trim().length>=12);
}
function go(n){
if(n>step){
if(step>=1&&step<=5&&!document.getElementById("nextBtn")?.disabled===false)return;
if(step===6&&!goal)return;
if(step===7&&(!name.trim()||action.trim().length<12))return;
}
step=n;render();window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
